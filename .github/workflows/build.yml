name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew tools/*.sh
      - run: ./gradlew -PjvmOnly=true :roxy-testing:check :roxy-ksp:jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results
          path: roxy-testing/build/test-results/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37"
      - run: chmod +x gradlew tools/*.sh
      - run: ./gradlew :samples:demo-module:assembleDebug :samples:demo-module:assembleRelease :samples:demo-target:assembleDebug
      - run: ./gradlew :samples:demo-module:roxyVerifyApk --apk=samples/demo-module/build/outputs/apk/debug/demo-module-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: demo-apks
          path: samples/**/build/outputs/apk/**/*.apk
